<title>Ghost Emotes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a fixed stage (a slice of the bar room) with one scrolling panel beside it, or under it on an upright phone. */
  :root {
    color-scheme: dark;
    --bg: #140e0a;
    --panel: #1f1611;
    --raised: #2a1e17;
    --line: #3f2e22;
    --ink: #f3ecd9;
    --dim: #bfae93;
    --brass: #f4b453;
    --brass-ink: #2a1a05;
    --good: #9fe0c6;
    --weak: #ffc9a3;
    --no: #ff9c8f;
    --stage: #1a110c;
    --glass: rgba(20, 14, 10, 0.82);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html { height: 100%; box-sizing: border-box; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .t-ui { font-family: var(--font); }

  #app {
    height: 100%; box-sizing: border-box; display: grid; gap: 8px;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: clamp(250px, 46%, 520px) minmax(0, 1fr);
  }
  @media (orientation: landscape) and (min-width: 540px) {
    #app { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) clamp(288px, 42%, 440px); }
  }

  /* ---- the stage ---- */
  #stage { position: relative; min-width: 0; min-height: 0; border-radius: 14px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay svg { position: absolute; overflow: hidden; display: block; }
  #inset { position: absolute; box-sizing: border-box; border: 1.5px solid var(--brass); border-radius: 8px; pointer-events: none; }
  #inset span, #size-now { position: absolute; right: 0; top: calc(100% + 4px); font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 999px; background: var(--glass); color: var(--brass); white-space: nowrap; }
  #size-now { right: auto; left: 8px; top: auto; bottom: 56px; pointer-events: none; }
  #strip { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; padding: 7px 6px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; background: var(--glass); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; padding: 0 7px; min-height: 36px; font-size: 12px; font-weight: 600; color: var(--dim); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
  .tog { border: 1.5px solid var(--line); background: var(--glass); border-radius: 10px; min-height: 40px; padding: 0 7px; font-size: 12px; font-weight: 600; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .tog::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; box-sizing: border-box; }
  .tog[aria-pressed="true"] { color: var(--ink); border-color: var(--brass); }
  .tog[aria-pressed="true"]::before { background: var(--brass); border-color: var(--brass); }
  #strip .right { display: flex; gap: 4px; }
  #nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dim); background: var(--stage); }

  /* ---- the side panel ---- */
  #side { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tabs { flex: none; display: flex; gap: 4px; padding: 5px; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1 1 0; min-height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--dim); font-weight: 600; font-size: 13px; }
  .tabs button[aria-selected="true"] { background: var(--raised); color: var(--ink); }
  .pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  .pad { padding: 10px; display: flex; flex-direction: column; gap: 12px; }

  #colour { position: sticky; top: 0; z-index: 2; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #colour b { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); flex: none; }
  .swatches { display: flex; gap: 7px; align-items: center; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; min-width: 0; }
  .swatches::-webkit-scrollbar { display: none; }
  .sw { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line); background: var(--c); padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--ink); }
  #free-colour { flex: none; width: 38px; height: 32px; padding: 0; border: 2px solid var(--line); border-radius: 9px; background: var(--raised); }

  .hint { margin: 0; color: var(--dim); font-size: 12.5px; }
  #all { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
  #all .seg, .row .seg { background: var(--bg); }
  .rows { display: flex; flex-direction: column; gap: 6px; container-type: inline-size; }
  .row { background: var(--raised); border-radius: 12px; border: 2px solid transparent; display: flex; flex-direction: column; }
  .row[data-on="1"] { border-color: var(--brass); }
  .row .play { border: 0; background: transparent; text-align: left; padding: 8px 10px 4px; min-height: 44px; display: flex; flex-direction: column; gap: 2px; border-radius: 10px; }
  .row .t { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .row .t small { font-weight: 400; font-size: 12px; color: var(--dim); }
  .row .rec { font-size: 12.5px; color: var(--dim); }
  .row .rec b { font-weight: 700; }
  .row .rec[data-k="pick"] b { color: var(--good); }
  .row .rec[data-k="ok"] b { color: var(--ink); }
  .row .rec[data-k="weak"] b { color: var(--weak); }
  .row .ctl { display: flex; align-items: center; gap: 4px; padding: 2px 6px 6px; }
  .row .seg { flex: 1 1 auto; min-width: 0; }
  .row .seg button { flex: 1 1 auto; padding: 0 3px; min-height: 38px; position: relative; font-size: 11.5px; }
  @container (min-width: 300px) { .row .seg button { font-size: 12.5px; padding: 0 6px; } }
  /* A take that has a star or a cross shows it in its corner, so marks on the takes not showing are not lost. */
  .row .seg button[data-mark]::after { position: absolute; top: 1px; right: 3px; font-size: 10px; line-height: 1; }
  .row .seg button[data-mark="yes"]::after { content: "\2605"; color: var(--brass); }
  .row .seg button[data-mark="no"]::after { content: "\2715"; color: var(--no); }
  .row .seg button[aria-pressed="true"][data-mark]::after { color: var(--brass-ink); }
  .mark { flex: none; width: 40px; height: 40px; border: 0; background: transparent; display: grid; place-items: center; color: #7d6a55; border-radius: 10px; }
  .mark svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
  .mark.yes[aria-pressed="true"] { color: var(--brass); }
  .mark.yes[aria-pressed="true"] svg { fill: currentColor; }
  .mark.no[aria-pressed="true"] { color: var(--no); }
  .mark.no[aria-pressed="true"] svg { stroke-width: 3; }

  #picks-text { margin: 0; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 13px/1.45 var(--mono); -webkit-user-select: text; user-select: text; }
  .btn { align-self: flex-start; min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--brass); color: var(--brass-ink); font-weight: 700; }
  #copy-state { color: var(--dim); font-size: 13px; min-height: 1.4em; margin: 0; }
  .notes h3 { margin: 0 0 4px; font-size: 14px; }
  .notes p, .notes ul { margin: 0; color: var(--dim); font-size: 13.5px; }
  .notes ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .notes b { color: var(--ink); font-weight: 600; }
  .notes section { display: flex; flex-direction: column; gap: 4px; }
  .notes a { color: var(--brass); }

  @media (max-height: 400px) { .tabs button { min-height: 32px; } #colour { padding-block: 3px; } }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="app">
  <section id="stage" aria-label="Stage">
    <canvas id="gl"></canvas>
    <div id="overlay"></div>
    <div id="size-now"></div>
    <div id="inset" hidden><span>Phone size</span></div>
    <div id="strip">
      <div class="seg" id="sizes" role="group" aria-label="Picture size">
        <button type="button" data-v="large" aria-pressed="true">Large</button>
        <button type="button" data-v="tv" aria-pressed="false">TV</button>
        <button type="button" data-v="phone" aria-pressed="false">Phone</button>
      </div>
      <div class="right">
        <button type="button" class="tog" id="faded" aria-pressed="false">Faded</button>
        <button type="button" class="tog" id="sound" aria-pressed="true">Sound</button>
      </div>
    </div>
    <div id="nogl" hidden>This preview needs 3D graphics (WebGL), and this browser has it turned off or does not support it. Try another browser or device.</div>
  </section>

  <section id="side">
    <div class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-pane="list" aria-selected="true">Emotes</button>
      <button type="button" role="tab" data-pane="picks" aria-selected="false">Picks</button>
      <button type="button" role="tab" data-pane="notes" aria-selected="false">Notes</button>
    </div>

    <div class="pane" id="pane-list" role="tabpanel">
      <div id="colour">
        <b>Colour</b>
        <div class="swatches" id="swatches">
          <input type="color" id="free-colour" value="#2f6f8f" aria-label="Any colour">
        </div>
      </div>
      <div class="pad">
        <p class="hint">Tap to play. Star what works, cross what does not.</p>
        <div id="all"><span>Every emote as</span><span class="seg" id="all-takes" role="group" aria-label="Show every emote as"></span></div>
        <div class="rows" id="rows"></div>
      </div>
    </div>

    <div class="pane" id="pane-picks" role="tabpanel" hidden>
      <div class="pad">
        <p class="hint">Your stars and crosses as text you can paste back.</p>
        <pre id="picks-text" tabindex="0"></pre>
        <button type="button" class="btn" id="copy">Copy picks</button>
        <p id="copy-state" role="status"></p>
      </div>
    </div>

    <div class="pane" id="pane-notes" role="tabpanel" hidden>
      <div class="pad notes" id="notes"></div>
    </div>
  </section>
</div>

<script>/*BUNDLE*/</script>
