# The pre-deploy gate: the full suite, run once on the combined result before a deploy, by hand
# (Actions tab, "Run workflow") or called from another workflow. Same script as `npm run gate` (`npm run deploy` runs it too, after its tree check).
# Left out because they cannot run on a hosted runner: the Windows-Chrome playtest and the
# production-settings check from DEPLOY.md (see the header of .github/scripts/predeploy.mjs).
name: predeploy-gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # The whole gate, one step after another on a 4-thread runner drawing in software, is longer than 30 minutes: on
    # 2026-11-24 every step through test:counters had passed when 30 minutes stopped it in test:who-am-i (setup 2 min,
    # unit tests 1, test:cork 8, test:moves 4, test:counters 6, and two steps still to come).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gate
