# TEMPORARY: the gate's two browser steps, several times each, on a hosted runner. Removed before review.
name: diag-slow

on:
  push:
    branches: [fix/gate-reliable-on-slow-machines]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - step: test:tin-derby
            runs: 5
          - step: test:cork
            runs: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: each run on a fresh Worker of its own
        run: |
          passed=0
          for i in $(seq 1 ${{ matrix.runs }}); do
            port=$((8860 + i))
            dir=$(mktemp -d)
            setsid npx wrangler dev --local --env=local --port $port --persist-to "$dir" > "$dir/w.log" 2>&1 &
            w=$!
            for k in $(seq 1 180); do curl -sf http://localhost:$port/api/party/config >/dev/null && break; sleep 1; done
            echo "=== run $i, load $(cat /proc/loadavg)"
            if npm run -s ${{ matrix.step }} -- --base=http://localhost:$port; then echo "=== run $i PASSED"; passed=$((passed+1)); else echo "=== run $i FAILED"; fi
            kill -TERM -- -$w || true
            sleep 3
          done
          echo "=== $passed of ${{ matrix.runs }} passed"
          [ $passed -eq ${{ matrix.runs }} ]
