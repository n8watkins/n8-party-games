# TEMPORARY (removed before merge): test:moves five times on GitHub's hosted runners.
name: tmp-moves-5x

on:
  push:
    branches: [fix/watchdog-frozen-page]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: local Worker
        run: |
          (WRANGLER_SEND_METRICS=false CI=1 npx wrangler dev --local --env=local --port 8791 > wrangler.log 2>&1 &)
          for i in $(seq 1 120); do curl -sf -o /dev/null http://localhost:8791/lobby/ && exit 0; sleep 1; done
          cat wrangler.log; exit 1
      - run: npm run test:moves -- --base=http://localhost:8791
