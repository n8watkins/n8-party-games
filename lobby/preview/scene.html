<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby concept scene (a still, nothing playable)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@800;900&display=swap">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "lean-qr": "/node_modules/lean-qr/index.mjs"
} }
</script>
<style>
/* A concept still. The room is drawn in 3D (scene.js); every word is HTML laid over it,
   placed from the same camera so signs sit on the wall and tags sit over heads. */
:root {
  --ink: #eef3ff; --soft: #a3b0cf; --dim: #7482a6;
  --cyan: #38bdf8; --violet: #b39dfc; --amber: #fbbf24;
  --accent: #38bdf8; --accent-rgb: 56, 189, 248;
  --plate: rgba(8, 13, 30, .9); --plate-line: rgba(132, 160, 230, .3);
  --text: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --u: 127px;  /* one metre on the back wall, set by scene.js */
  --t: 1;      /* text boost on the phone */
}
body.lantern {
  --accent: #f6b35c; --accent-rgb: 246, 179, 92;
  --plate: rgba(30, 17, 12, .9); --plate-line: rgba(246, 190, 130, .32);
  --ink: #fff3e2; --soft: #dbbfa2; --dim: #a98d74;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04070f; overflow: hidden; }
body { color: var(--ink); font-family: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx, #over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.at { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
.at.up { transform: translate(-50%, -100%); }
.at.down { transform: translate(-50%, 0); }

/* Name tag over a character. */
.tag {
  display: flex; align-items: center; gap: calc(var(--u) * .05 * var(--t));
  padding: calc(var(--u) * .035 * var(--t)) calc(var(--u) * .085 * var(--t)) calc(var(--u) * .035 * var(--t)) calc(var(--u) * .06 * var(--t));
  border-radius: 99px;
  background: rgba(6, 10, 22, .78);
  border: 1px solid rgba(255, 255, 255, .16);
  font: 600 calc(var(--u) * .135 * var(--t))/1.1 var(--text);
  letter-spacing: -.005em;
}
.tag i { width: calc(var(--u) * .085 * var(--t)); height: calc(var(--u) * .085 * var(--t)); border-radius: 50%; background: var(--seat); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .28); }
.tag.dimmed { opacity: .82; }
.tag.you { background: #f4f8ff; color: #060a16; border-color: #fff; font-weight: 800; box-shadow: 0 0 calc(var(--u) * .2) rgba(255, 255, 255, .35); }
.tag.you i { box-shadow: 0 0 0 1.5px rgba(6, 10, 22, .5); }
.tag.you::after {
  content: ""; position: absolute; left: 50%; top: 100%; margin-left: calc(var(--u) * -.06 * var(--t));
  border: calc(var(--u) * .06 * var(--t)) solid transparent; border-top-color: #f4f8ff; border-bottom: 0;
}
.bubble {
  position: absolute; left: 100%; bottom: 62%; margin-left: calc(var(--u) * -.04);
  padding: calc(var(--u) * .04 * var(--t)) calc(var(--u) * .09 * var(--t));
  border-radius: calc(var(--u) * .12 * var(--t));
  border-bottom-left-radius: 2px;
  background: #f4f8ff; color: #060a16;
  font: 800 calc(var(--u) * .15 * var(--t))/1.1 var(--text);
  transform: rotate(-6deg);
}

/* The plate under a game box: its name, what you need, and one pip per vote. */
.plate {
  width: calc(var(--u) * 1.62);
  padding: calc(var(--u) * .07) calc(var(--u) * .1) calc(var(--u) * .075);
  background: var(--plate);
  border: 1px solid var(--plate-line);
  border-radius: calc(var(--u) * .06);
  display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: calc(var(--u) * .06); row-gap: calc(var(--u) * .035);
  transition: none;
}
.plate b { grid-column: 1 / -1; font: 700 calc(var(--u) * .165)/1.1 var(--text); letter-spacing: -.015em; }
.plate .need { grid-row: 2; grid-column: 1; font: 500 calc(var(--u) * .088)/1.1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--need); }
.pips { display: flex; gap: calc(var(--u) * .04); }
.pips i { width: calc(var(--u) * .12); height: calc(var(--u) * .12); border-radius: 50%; border: 1.5px solid rgba(160, 180, 230, .35); }
.pips i.on { background: var(--seat); border-color: rgba(255, 255, 255, .75); box-shadow: 0 0 calc(var(--u) * .1) var(--seat); }
.pips i.going { border: 1.5px dashed var(--seat); background: transparent; }
.plate.lead { border-color: rgba(var(--accent-rgb), .75); box-shadow: 0 0 calc(var(--u) * .28) rgba(var(--accent-rgb), .28); }
.plate.off { opacity: .45; }
body.phone .plate { width: calc(var(--u) * 1.62); padding: 4px 6px; border-radius: 5px; }
body.phone .plate b { font-size: 11px; }
body.phone .plate .need { display: none; }
body.phone .pips { gap: 2.5px; }
body.phone .pips i { width: 7px; height: 7px; border-width: 1px; }

/* The join sign over the door. */
.join {
  width: calc(var(--u) * 1.16);
  padding: calc(var(--u) * .08);
  background: var(--plate); border: 1px solid var(--plate-line); border-radius: calc(var(--u) * .07);
  text-align: center;
}
.join small { display: block; font: 500 calc(var(--u) * .082)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.join svg { display: block; width: 100%; height: auto; margin: calc(var(--u) * .07) 0; border-radius: calc(var(--u) * .03); background: #eef3ff; }
.join .pin { font: 700 calc(var(--u) * .27)/1 var(--mono); letter-spacing: .1em; padding-left: .1em; }
.join .addr { margin-top: calc(var(--u) * .045); font: 400 calc(var(--u) * .07)/1 var(--mono); color: var(--soft); }
body.phone .join { width: auto; padding: 4px 8px 5px; }
body.phone .join svg, body.phone .join .addr { display: none; }
body.phone .join small { font-size: 7px; }
body.phone .join .pin { font-size: 15px; margin-top: 3px; }

.shelf-tag { font: 500 calc(var(--u) * .085)/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); text-align: center; }
.shelf-tag b { display: block; font: 700 calc(var(--u) * .14)/1.2 var(--text); letter-spacing: -.01em; text-transform: none; color: var(--soft); }
body.phone .shelf-tag { font-size: 6.5px; }
body.phone .shelf-tag b { font-size: 10px; }

/* The countdown: one ring, one number, the game's name. */
.dial { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); display: grid; place-items: center; align-content: center; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dial .num { position: relative; font: 700 calc(var(--u) * .86)/1 var(--mono); color: #fff; text-shadow: 0 0 calc(var(--u) * .3) rgba(var(--accent-rgb), .8); }
.dial .what { position: relative; margin-bottom: calc(var(--u) * .06); font: 500 calc(var(--u) * .1)/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }

/* The front of the stage: one calm line on the big screen, the controls on a phone. */
.fascia { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--u) * .3); }
.brand { display: flex; align-items: center; gap: calc(var(--u) * .08); font: 800 calc(var(--u) * .15)/1 var(--text); letter-spacing: -.01em; color: var(--soft); }
.brand i { width: calc(var(--u) * .17); height: calc(var(--u) * .115); border-radius: calc(var(--u) * .03); background: var(--accent); box-shadow: 0 0 calc(var(--u) * .14) rgba(var(--accent-rgb), .7); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); font: 500 calc(var(--u) * .165)/1 var(--text); color: var(--soft); white-space: nowrap; }
.hint b { color: var(--ink); font-weight: 700; }
.hint .k { font: 500 calc(var(--u) * .1)/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-right: calc(var(--u) * .12); vertical-align: .08em; }
.here { font: 500 calc(var(--u) * .1)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

body.phone .fascia { padding: 0 max(18px, env(safe-area-inset-left)); align-items: center; }
.pad { display: flex; gap: 12px; }
.key {
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(20, 31, 64, .92);
  border: 1.5px solid rgba(132, 160, 230, .42);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 4px 0 rgba(0, 0, 0, .45);
  color: var(--ink);
}
.key svg { width: 26px; height: 26px; }
.key.small { width: 44px; height: 44px; align-self: center; color: var(--soft); }
.key.small svg { width: 22px; height: 22px; }
.key.jump { background: var(--accent); border-color: #c6ecff; color: #04111f; }
.mine { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; }
.mine small { display: block; font: 500 8.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.mine b { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 5px; font: 700 16px/1 var(--text); letter-spacing: -.01em; }
.mine b i { width: 10px; height: 10px; border-radius: 50%; background: var(--seat); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .6); }
.mine span { display: block; margin-top: 5px; font: 400 9.5px/1 var(--mono); color: var(--dim); letter-spacing: .06em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <svg id="fx" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="over"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
