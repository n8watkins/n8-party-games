/* A concept still. The room is drawn in 3D (scene.js); every word is HTML laid over it,

   The warm bar room is the base look; body.room-tech is the navy room skin. */
:root {

  --chalk: "Caveat", "Inter", sans-serif;
  --u: 127px;  /* one metre on the back wall, set by scene.js */
  --t: 1;      /* text boost on the phone */
}
body.room-tech {
  --ink: #eef3ff; --soft: #a3b0cf; --dim: #7482a6;
  --accent: #38bdf8; --accent-rgb: 56, 189, 248;
  --plate: rgba(8, 13, 30, .93); --plate-line: rgba(132, 160, 230, .34);
  --title: "Inter", system-ui, sans-serif;
  --chalk: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }

#stage { position: fixed; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.at { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }

.at.down { transform: translate(-50%, 0); }

/* Name tag over a character. */
