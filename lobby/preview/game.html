<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby concept frames set inside a game (stills, nothing playable)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Storyboard frames that happen inside Cork & Bell, or on a second screen.
   ?frame=arrive | end | menu | phone | display
   The background is a real Cork & Bell screenshot; everything drawn on top is the proposal. */
:root { --cream: #f4e6c4; --ink: #2a1810; --red: #8c1d18; --gold: #e2b45a; --accent: #f6b35c; --text: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; --title: "Abril Fatface", Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #120b08; color: var(--cream); font-family: var(--text); -webkit-font-smoothing: antialiased; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: fixed; inset: 0; background: rgba(18, 8, 6, .55); }
.plate { position: fixed; transform: translateX(-50%); display: flex; align-items: baseline; justify-content: center; min-width: 222px; gap: 12px; padding: 5px 22px 7px; background: var(--cream); color: var(--ink); border-radius: 6px; border-bottom: 5px solid var(--seat); font: 400 24px/1.2 var(--title); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); white-space: nowrap; }
.plate b { font: 400 34px/1 var(--title); }
.door { position: fixed; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(40, 20, 14, .92); border: 1.5px solid rgba(244, 230, 196, .55); color: var(--cream); }
.door.on { background: var(--cream); color: var(--ink); box-shadow: 0 0 0 5px rgba(244, 230, 196, .25); }
.door svg { width: 24px; height: 24px; }
/* Sits over the caption baked into the screenshot. */
.chip { position: fixed; left: 10px; top: 8px; min-width: 400px; padding: 20px 22px; border-radius: 12px; background: rgba(40, 20, 14, .96); border: 1px solid rgba(244, 230, 196, .4); font: 600 19px/1 var(--text); white-space: nowrap; }
.chip b { font-family: var(--mono); }
.menu { position: fixed; width: 470px; padding: 12px; border-radius: 16px; background: var(--cream); color: var(--ink); box-shadow: 0 18px 50px rgba(0, 0, 0, .65); }
.menu::before { content: ""; position: absolute; bottom: 100%; right: 150px; border: 11px solid transparent; border-bottom-color: var(--cream); border-top: 0; }
.choice { display: grid; grid-template-columns: 52px 1fr; gap: 4px 14px; align-items: center; padding: 14px 16px; border-radius: 10px; }
.choice + .choice { margin-top: 6px; border-top: 0; }
.choice.party { background: rgba(140, 29, 24, .1); }
.choice .ic { grid-row: 1 / span 2; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: var(--cream); }
.choice.me .ic { background: transparent; color: var(--ink); border: 2px solid rgba(42, 24, 16, .45); }
.choice .ic svg { width: 28px; height: 28px; }
.choice h3 { margin: 0; font: 800 21px/1.15 var(--text); }
.choice p { margin: 0; font: 500 15px/1.3 var(--text); color: #5a4234; }
.choice .tally { display: inline-block; margin-left: 8px; padding: 3px 9px; border-radius: 99px; background: var(--red); color: var(--cream); font: 700 12.5px/1.2 var(--text); vertical-align: 2px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 18px; border-radius: 20px 20px 0 0; background: var(--cream); color: var(--ink); box-shadow: 0 -12px 40px rgba(0, 0, 0, .6); }
.sheet::before { content: ""; display: block; width: 42px; height: 5px; margin: 0 auto 10px; border-radius: 3px; background: rgba(42, 24, 16, .3); }
.sheet .choice { grid-template-columns: 44px 1fr; padding: 12px; }
.sheet .choice .ic { width: 44px; height: 44px; }
.sheet .choice .ic svg { width: 24px; height: 24px; }
.sheet .choice h3 { font-size: 17px; }
.sheet .choice p { font-size: 13px; }
.sheet .cancel { margin-top: 8px; text-align: center; font: 700 15px/2.4 var(--text); color: #5a4234; }
.end { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 700px; padding: 30px 40px 32px; border-radius: 10px; background: var(--cream); color: var(--ink); border: 3px solid var(--red); box-shadow: 0 24px 70px rgba(0, 0, 0, .7); text-align: center; }
.end h2 { margin: 0 0 14px; font: 400 46px/1.1 var(--title); color: var(--red); }
.end .row { display: grid; grid-template-columns: 34px 1fr auto 150px; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px dotted rgba(42, 24, 16, .4); text-align: left; font: 400 26px/1 var(--title); }
.end .row u { text-decoration: none; color: var(--seat); }
.end .row s { text-decoration: none; }
.end .row em { justify-self: end; padding: 5px 12px; border-radius: 99px; background: #2b3a34; color: #ffe08a; font: 700 16px/1 var(--text); font-style: normal; }
.end .row em.none { background: transparent; color: #8a7462; }
.end .note { margin: 16px 0 16px; font: 500 17px/1.3 var(--text); color: #5a4234; }
.end .go { display: inline-flex; align-items: center; gap: 12px; padding: 14px 30px; border-radius: 99px; background: var(--red); color: var(--cream); font: 400 24px/1 var(--title); }
.end .go i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--cream); font: 800 15px/1 var(--text); font-style: normal; }
.end .alt { margin-top: 12px; font: 600 15px/1 var(--text); color: #5a4234; text-decoration: underline; }
/* A laptop or TV opening the address to become the room's screen. */
.browser { position: fixed; inset: 0; display: grid; grid-template-rows: 58px 1fr; background: radial-gradient(1200px 700px at 30% 0, #2b1913, #120b08); }
.bar { display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #24160f; border-bottom: 1px solid rgba(246, 190, 130, .2); }
.bar i { width: 13px; height: 13px; border-radius: 50%; background: #5a4234; }
.bar .url { flex: 1; max-width: 760px; margin-left: 18px; padding: 9px 18px; border-radius: 99px; background: #120b08; font: 500 17px/1 var(--mono); color: #dbbfa2; }
.bar .url b { color: #fff; }
.page { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; padding: 0 110px; }
.page h1 { margin: 12px 0 8px; font: 400 60px/1.05 var(--title); }
.page .lead { margin: 0 0 26px; font: 500 21px/1.4 var(--text); color: #dbbfa2; max-width: 30ch; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--text); color: #dbbfa2; }
.brand i { width: 24px; height: 16px; border-radius: 4px; background: var(--accent); }
.digits { display: flex; gap: 12px; margin-bottom: 26px; }
.digits b { display: grid; place-items: center; width: 84px; height: 104px; border-radius: 12px; background: #1e120d; border: 2px solid rgba(246, 190, 130, .5); font: 700 60px/1 var(--mono); color: #fff; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 3px 14px; padding: 16px 20px; margin-bottom: 12px; border-radius: 14px; border: 2px solid rgba(246, 190, 130, .25); max-width: 560px; }
.opt i { grid-row: 1 / span 2; align-self: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(246, 190, 130, .6); }
.opt h3 { margin: 0; font: 800 21px/1.2 var(--text); }
.opt p { margin: 0; font: 500 16px/1.35 var(--text); color: #dbbfa2; }
.opt.on { border-color: var(--accent); background: rgba(246, 179, 92, .12); }
.opt.on i { background: var(--accent); box-shadow: inset 0 0 0 5px #1e120d; }
.btn { display: inline-block; margin-top: 10px; padding: 16px 32px; border-radius: 99px; background: var(--accent); color: #1a0e06; font: 800 21px/1 var(--text); }
.peek { border-radius: 16px; overflow: hidden; border: 1px solid rgba(246, 190, 130, .35); box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.peek img { display: block; width: 100%; }
.peek div { padding: 14px 18px; background: #1e120d; font: 600 17px/1.3 var(--text); color: #dbbfa2; }
.peek div b { color: #fff; }
</style>
</head>
<body>
<script type="module">
const frame = new URLSearchParams(location.search).get("frame") || "arrive";
const SEATS = [["Mabel", "#c8382c"], ["Fitch", "#2f6f8f"], ["Dolly", "#d9a02a"], ["Tom", "#3f7a4a"]];
const DOOR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/><path d="M13 3.500v17l-7-1.500V5z"/><path d="M10 12v.5"/></svg>`;
const ROOM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10l8-6 8 6v10"/><path d="M10 20v-6h4v6"/></svg>`;
const OUT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>`;
const choices = (tally) => `
  <div class="choice party"><div class="ic">${ROOM}</div><h3>Back to the room<span class="tally">${tally}</span></h3><p>Everyone goes. Needs most of the players, or the host.</p></div>
  <div class="choice me"><div class="ic">${OUT}</div><h3>Leave the party</h3><p>Only you. Your piece walks out of the door.</p></div>`;
const plates = (scores) => [[481, 481], [1440, 481], [481, 1021], [1440, 1021]].map(([x, y], i) =>
  `<div class="plate" style="left:${x}px;top:${y}px;--seat:${SEATS[i][1]}">${SEATS[i][0]}<b>${scores[i]}</b></div>`).join("");
const CHIP = `<div class="chip">Cork &amp; Bell · party <b>4827</b></div>`;
const stalls = `<img id="bg" src="/cork-and-bell/docs/shots/07-four-stalls.jpg" alt="">`;
const html = {
  arrive: () => `${stalls}${plates([60, 25, 85, 10])}
    ${CHIP}
    <div class="door" style="left:1596px;top:12px">${DOOR}</div>`,
  end: () => `${stalls}<div class="shade"></div>${plates([1075, 570, 1715, 1111])}${CHIP}
    <div class="end"><h2>Dolly takes the prize</h2>
      ${[[2, 1715, 3], [3, 1111, 2], [0, 1075, 1], [1, 570, 0]].map(([s, pts, up], i) => `<div class="row"><u style="--seat:${SEATS[s][1]}">${i + 1}</u><span>${SEATS[s][0]}</span><s>${pts}</s><em class="${up ? "" : "none"}">${up ? `+${up} tonight` : "no points"}</em></div>`).join("")}
      <p class="note">The points go up on the board in the room.</p>
      <div class="go">Back to the room <i>5</i></div>
      <div class="alt">Stay for a rematch</div>
    </div>
    <div class="door" style="left:1596px;top:12px">${DOOR}</div>`,
  menu: () => `${stalls}<div class="shade" style="background:rgba(18,8,6,.35)"></div>${plates([410, 265, 620, 380])}${CHIP}
    <div class="door on" style="left:1596px;top:12px">${DOOR}</div>
    <div class="menu" style="left:1298px;top:72px">${choices("1 of 4 so far")}</div>`,
  phone: () => `<img id="bg" src="/cork-and-bell/docs/shots/25-battle-rejoined-phone.png" alt=""><div class="shade" style="background:rgba(18,8,6,.5)"></div>
    <div class="door on" style="left:330px;top:64px">${DOOR}</div>
    <div class="sheet">${choices("1 of 4")}<div class="cancel">Keep playing</div></div>`,
  display: () => `<div class="browser"><div class="bar"><i></i><i></i><i></i><div class="url"><b>partygames.n8builds.dev</b></div></div>
    <div class="page"><div>
      <div class="brand"><i></i>n8 Party</div>
      <h1>Type the room code</h1>
      <p class="lead">It is on the sign by the door in the room.</p>
      <div class="digits"><b>4</b><b>8</b><b>2</b><b>7</b></div>
      <div class="opt"><i></i><h3>Play on this device</h3><p>Join as a player, like on a phone.</p></div>
      <div class="opt on"><i></i><h3>Use this as the room's screen</h3><p>Shows the room and the games for everyone. Nobody plays from it.</p></div>
      <div class="btn">Show the room here</div>
    </div>
    <div class="peek"><img src="shots/room-1-bar.png" alt=""><div><b>Party 4827</b> · 4 here · this screen will show the room for everyone</div></div>
    </div></div>`,
};
document.body.innerHTML = (html[frame] || html.arrive)();
await Promise.all([document.fonts.load('400 30px "Abril Fatface"'), document.fonts.load('800 20px "Inter"'), document.fonts.load('600 20px "Inter"'), document.fonts.load('500 20px "Inter"'), document.fonts.load('700 20px "JetBrains Mono"'),
  ...[...document.images].map((i) => i.decode().catch(() => {}))]).catch(() => {});
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
