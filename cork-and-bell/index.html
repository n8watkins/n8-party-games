<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1020" />
    <title>Cork &amp; Bell</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239c2b20'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23c89a3c'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../party-kit/client/lobby.css" />
    <link rel="stylesheet" href="game/style.css" />
    <script type="importmap">
      { "imports": { "three": "./game/vendor/three.module.js", "three/addons/": "./game/vendor/addons/" } }
    </script>
  </head>
  <body>
    <canvas id="stage" aria-label="A fairground shooting gallery at dusk"></canvas>

    <div id="hud">
      <header id="title">
        <h1>Cork &amp; Bell</h1>
        <p id="hint">Point at a target and click to fire.</p>
        <!-- The round's two challenges, ticked off as they are done. -->
        <ul id="tasks" hidden aria-label="Challenges"></ul>
      </header>

      <!-- While a round is on: the sound switch and the way to a battle, top right. -->
      <div id="controls" hidden>
        <button id="sound" class="sound" type="button" aria-pressed="false">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor" />
            <path class="waves" d="M15.5 8.6a5 5 0 0 1 0 6.8M18.2 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path class="mute" d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span>Sound: off</span>
        </button>
        <button id="battle-top" type="button">Battle with friends</button>
      </div>

      <p id="turn"><i aria-hidden="true"></i>Turn your phone sideways for the whole stall</p>

      <!-- Before a round: the house plays behind this board, and the three choices are spelled out. -->
      <section id="start" hidden aria-label="Start">
        <header>
          <h2>Step right up <span id="start-credit">Free play</span></h2>
          <p id="start-note">Or click any target to take the gun.</p>
        </header>
        <div class="choices">
          <button id="start-solo" type="button" class="primary">
            <b>Play alone</b>
            <small id="start-beat">90 seconds, 70 corks.</small>
          </button>
          <button id="battle" type="button">
            <b>Battle with friends</b>
            <small>2 to 4 players. Host, or join with a PIN.</small>
          </button>
          <button id="start-sound" class="sound" type="button" aria-pressed="false">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor" />
              <path class="waves" d="M15.5 8.6a5 5 0 0 1 0 6.8M18.2 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path class="mute" d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <b>Sound is off</b>
            <small>Turn it on.</small>
          </button>
        </div>
      </section>

      <!-- The tally: a paper ticket. Time and score are the big figures; the run and the corks sit on the stub. -->
      <div id="tally" hidden>
        <div class="row main">
          <div class="cell" id="time-cell"><span class="label">Time</span><span id="time" class="num">1:30</span></div>
          <div class="cell" id="score-cell"><span class="label">Score</span><span id="score" class="num">0</span></div>
        </div>
        <div class="row stub">
          <div class="cell" id="run-cell"><span class="label">Run</span><span class="fig"><span id="run" class="num">0</span><span id="run-times" class="times" hidden></span></span></div>
          <div class="cell" id="corks-cell"><span class="label">Corks</span><span class="fig"><span id="corks" class="num">70</span></span></div>
        </div>
      </div>

      <div id="rivals" hidden></div>
      <div id="banner" role="status" aria-live="polite" hidden></div>
      <div id="count" hidden></div>
      <div id="pops" aria-hidden="true"></div>
      <div id="names" aria-hidden="true"></div>
      <div id="reticle" aria-hidden="true"></div>
      <div id="net" hidden></div>

      <section id="card" hidden aria-live="polite">
        <h2 id="card-title">Time</h2>
        <ol id="card-rows"></ol>
        <!-- A score that makes the board: three letters, arcade style. -->
        <form id="initials" hidden autocomplete="off">
          <label for="initials-in">You made the board. Chalk up three letters:</label>
          <div class="letters">
            <input id="initials-in" name="initials" type="text" maxlength="3" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="AAA" aria-describedby="initials-say" />
            <button id="initials-ok" type="submit">Chalk it up</button>
          </div>
          <p id="initials-say" role="status"></p>
        </form>
        <p id="card-note"></p>
        <div class="card-actions">
          <button id="again" type="button">Play again</button>
          <button id="card-battle" type="button" class="quiet">Battle with friends</button>
        </div>
      </section>
    </div>

    <div id="loading">Lighting the lamps</div>
    <script type="module" src="game/main.js"></script>
  </body>
</html>
