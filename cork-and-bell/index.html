<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1020" />
    <title>Cork &amp; Bell</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239c2b20'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23c89a3c'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../party-kit/client/lobby.css" />
    <link rel="stylesheet" href="game/style.css" />
    <script type="importmap">
      { "imports": { "three": "./game/vendor/three.module.js", "three/addons/": "./game/vendor/addons/" } }
    </script>
  </head>
  <body>
    <canvas id="stage" aria-label="A fairground shooting gallery at dusk"></canvas>

    <div id="hud">
      <header id="title">
        <h1>Cork &amp; Bell</h1>
        <p id="hint">Point at a target and click to fire.</p>
      </header>

      <div id="controls">
        <button id="sound" type="button" aria-pressed="false">Enable sound</button>
        <button id="battle" type="button">Play a battle</button>
      </div>

      <div id="tally" hidden>
        <div class="cell"><span class="label">Time</span><span id="time" class="num">1:30</span></div>
        <div class="cell"><span class="label">Score</span><span id="score" class="num">0</span></div>
        <div class="cell" id="run-cell"><span class="label">Run</span><span id="run" class="num">0</span></div>
        <div class="cell"><span class="label">Corks</span><span id="corks" class="num">70</span></div>
      </div>

      <div id="rivals" hidden></div>
      <div id="banner" role="status" aria-live="polite" hidden></div>
      <div id="count" hidden></div>
      <div id="pops" aria-hidden="true"></div>
      <div id="names" aria-hidden="true"></div>
      <div id="reticle" aria-hidden="true"></div>
      <div id="net" hidden></div>

      <section id="card" hidden aria-live="polite">
        <h2 id="card-title">Time</h2>
        <ol id="card-rows"></ol>
        <p id="card-note"></p>
        <div class="card-actions">
          <button id="again" type="button">Play again</button>
          <button id="card-battle" type="button" class="quiet">Play a battle</button>
        </div>
      </section>
    </div>

    <div id="loading">Lighting the lamps</div>
    <script type="module" src="game/main.js"></script>
  </body>
</html>
