<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#120b08" />
    <title>n8 Party</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <!-- A plain front page: the real one is being designed separately. It only has to lead into the party room. -->
    <main>
      <p class="brand"><span class="brand-mark"></span>n8 Party</p>
      <h1>Party games for two to four, in one room.</h1>
      <p class="lead">Start a party on a laptop or a TV, and everyone joins from their phone with a code.</p>
      <a class="button" href="/lobby/?start">Start a party</a>
      <form class="join" action="/lobby/" method="get">
        <label for="join">Join with a code</label>
        <div class="join-row">
          <input id="join" name="join" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="0000" required />
          <button class="button quiet" type="submit">Join</button>
        </div>
      </form>
      <p class="aside">Or play one game on its own: <a href="/cork-and-bell/">Cork &amp; Bell</a>.</p>
    </main>
  </body>
</html>
